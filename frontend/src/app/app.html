<router-outlet />

@if (toastService.toasts().length > 0) {
  <div class="toast-wrap" role="region" aria-live="polite" aria-label="Notifications">
    @for (t of toastService.toasts(); track t.id) {
      <div [class]="toastClass(t.type)" role="status">
        <span>{{ t.text }}</span>
        <button type="button" class="btn btn-ghost btn-icon" style="color:inherit;padding:2px" (click)="toastService.dismiss(t.id)" aria-label="Dismiss notification">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    }
  </div>
}
