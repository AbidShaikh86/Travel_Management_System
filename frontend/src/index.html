<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>TravelDesk — Corporate Travel &amp; Expense Clearing</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TravelDesk corporate travel request, policy compliance, budget authorization, and expense reimbursement workspace.">
  <meta name="theme-color" content="#0f172a">
  <script src="env.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("traveldesk-theme");
        var mode = (saved === "light" || saved === "dark")
          ? saved
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", mode);
        document.documentElement.style.colorScheme = mode;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
